name: nameit
description: Learn student names from faces – and faces from names – with small games.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'   # Flutter 3.38 or newer

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  http: ^1.2.2
  crypto: ^3.0.3
  image_picker: ^1.1.2
  file_picker: ^13.3.1
  csv: ^8.0.0
  excel: ^4.0.6
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.0.1
  package_info_plus: ^10.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Only for screenshot_test/ (fake app folder for the documentation screenshots).
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  # The demo class from the documentation, loadable from the home screen.
  assets:
    - docs/demo/demo-classes.csv
    - docs/demo/avatars/

# App icon for Android and iOS. Generated into android/ and ios/ by
#   dart run flutter_launcher_icons
# Sources are in assets/icon/ (the .svg files are the masters).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  min_sdk_android: 24   # Flutter's own minimum
  adaptive_icon_background: "#7C2AD6"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
