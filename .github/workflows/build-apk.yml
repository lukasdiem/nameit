name: Build APK

# Three jobs:
#   check   – analyze + tests (fast, runs in parallel with build)
#   build   – release APK, uploaded as a workflow artifact
#   release – only on main / version tags, once check AND build have passed
#
# Versioning (see "Versioning" in README.md):
#   version name  = `version:` in pubspec.yaml (e.g. 0.2.0)
#   version code  = github.run_number (always increasing, so updates install over old builds)
#   push to main  → pre-release  v0.2.0-build.42
#   push tag v0.2.0 → release    v0.2.0 (tag must match pubspec.yaml)
#
# Keep this file name: github.run_number is counted per workflow file, and a
# reset would give new builds lower version codes than the installed ones.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

# A newer push to the same PR cancels the older run. Main and tags always finish,
# so every build number that is pushed also gets a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Run tests
        run: flutter test

  build:
    runs-on: ubuntu-latest
    # A hung Gradle daemon once kept a run going for 49 minutes.
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      apk: ${{ steps.version.outputs.apk }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          build=${{ github.run_number }}
          if [ -z "$version" ]; then
            echo "::error file=pubspec.yaml::No 'version: X.Y.Z' found in pubspec.yaml"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version. Bump pubspec.yaml first, then tag."
              exit 1
            fi
            tag=$GITHUB_REF_NAME; prerelease=false
          else
            tag="v$version-build.$build"; prerelease=true
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
            echo "apk=nameit-$version-build.$build.apk"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "### nameIT $version (build $build) → \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'   # matches the Flutter 3.47 Android template (JVM target 17)

      # Caches the Gradle distribution, downloaded dependencies and the Gradle
      # build cache between runs. Only main writes the cache; PRs read it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic   # open-source GitHub Actions cache, no external service
          add-job-summary: never

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ and ios/ are generated here unless they are committed to the repo.
      - name: Generate platform folders
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --org at.nameit --project-name nameit .
          fi
          dart run tool/setup.dart

      # The same signing key on every build lets new versions install over old ones
      # without uninstalling (which would delete the app's data).
      - name: Use the stored signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the stored key."
          else
            echo "::warning::No SIGNING_KEYSTORE secret – each build gets a new key, so updates need an uninstall first."
          fi

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      # arm64 only: every phone from the last ~8 years is 64-bit ARM. Building one
      # architecture instead of three cuts the Dart AOT compile time and APK size
      # to about a third. Add `android-arm` back if a very old 32-bit phone needs it.
      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build }}
          mv build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.apk }}"
          ls -lh "${{ steps.version.outputs.apk }}"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ steps.version.outputs.apk }}
          retention-days: 14
          compression-level: 0   # APKs are already zipped

  release:
    if: github.event_name != 'pull_request'
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: nameIT ${{ needs.build.outputs.version }}${{ needs.build.outputs.prerelease == 'true' && format(' (build {0})', needs.build.outputs.build) || '' }}
          body: |
            Version ${{ needs.build.outputs.version }}, build ${{ needs.build.outputs.build }}, from ${{ github.sha }}.
            Download the .apk on your phone and open it to install.
          generate_release_notes: ${{ needs.build.outputs.prerelease != 'true' }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease != 'true' }}
          files: ${{ needs.build.outputs.apk }}
