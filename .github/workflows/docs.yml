name: Docs

# Builds the documentation site (MkDocs Material, sources in docs/ + mkdocs.yml)
# on every change. Pushes to main also publish it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  # The screenshot workflow's commits don't trigger this one; run it by hand
  # (or push anything under docs/) to publish fresh screenshots.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      # The legal pages carry [[FILL IN: …]] placeholders for the provider's
      # name and contact. Never publish them half-filled.
      - name: Legal pages complete
        run: |
          if grep -rn '\[\[FILL IN' docs/; then
            echo "::error::Fill in the [[FILL IN: …]] placeholders above before publishing."
            exit 1
          fi

      # --strict turns broken links and missing images into errors.
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
